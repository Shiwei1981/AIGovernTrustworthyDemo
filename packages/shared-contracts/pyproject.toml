[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-contracts"
version = "0.1.0"
description = "Shared contracts for AIGovernTrustworthyDemo"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_contracts*"]
