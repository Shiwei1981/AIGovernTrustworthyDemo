[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-observability"
version = "0.1.0"
description = "Standalone shared observability package for AIGovernTrustworthyDemo"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.0",
    "azure-identity>=1.15",
    "azure-monitor-opentelemetry-exporter>=1.0.0b1",
    "opentelemetry-sdk>=1.20",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_observability*"]
