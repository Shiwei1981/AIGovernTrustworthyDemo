<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Governance — LLM Invocation Archive Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: linear-gradient(135deg, #1a1f2e 0%, #0d1b2a 100%); border-bottom: 1px solid #2d3748; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
  header .logo { font-size: 22px; font-weight: 700; color: #63b3ed; letter-spacing: -0.5px; }
  header .sub  { font-size: 13px; color: #718096; }
  .toolbar { background: #1a1f2e; border-bottom: 1px solid #2d3748; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: #2d3748; border: 1px solid #4a5568; color: #e2e8f0; padding: 7px 12px; border-radius: 6px; font-size: 13px; outline: none; }
  .toolbar input:focus, .toolbar select:focus { border-color: #63b3ed; }
  .toolbar input[type=text] { width: 300px; }
  button { background: #2b6cb0; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: background .15s; }
  button:hover { background: #3182ce; }
  button.secondary { background: #2d3748; color: #a0aec0; }
  button.secondary:hover { background: #4a5568; color: #e2e8f0; }
  .layout { display: flex; height: calc(100vh - 120px); }
  .sidebar { width: 340px; min-width: 240px; border-right: 1px solid #2d3748; overflow-y: auto; background: #131720; }
  .sidebar-header { padding: 12px 16px; font-size: 12px; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: .8px; border-bottom: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; }
  .record { padding: 12px 16px; border-bottom: 1px solid #1e2535; cursor: pointer; transition: background .1s; }
  .record:hover { background: #1a2035; }
  .record.active { background: #1a2b4a; border-left: 3px solid #63b3ed; }
  .record .rid  { font-size: 11px; font-family: monospace; color: #4a5568; }
  .record .svc  { font-size: 12px; color: #90cdf4; margin-top: 2px; font-weight: 500; }
  .record .meta { font-size: 11px; color: #718096; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .badge.rag   { background: #2c7a7b; color: #81e6d9; }
  .badge.foundry { background: #44337a; color: #d6bcfa; }
  .badge.ok    { background: #276749; color: #9ae6b4; }
  .badge.fail  { background: #742a2a; color: #fc8181; }
  .main { flex: 1; overflow-y: auto; padding: 0; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #4a5568; gap: 12px; }
  .empty .icon { font-size: 48px; }
  .tabs { display: flex; border-bottom: 1px solid #2d3748; background: #1a1f2e; padding: 0 24px; }
  .tab { padding: 12px 20px; font-size: 13px; cursor: pointer; color: #718096; border-bottom: 2px solid transparent; transition: color .15s; }
  .tab.active { color: #63b3ed; border-color: #63b3ed; }
  .tab:hover:not(.active) { color: #a0aec0; }
  .pane { padding: 24px; display: none; }
  .pane.active { display: block; }
  .section-title { font-size: 11px; font-weight: 700; color: #718096; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .kv-grid { display: grid; grid-template-columns: 180px 1fr; gap: 6px 16px; margin-bottom: 20px; }
  .kv-key { font-size: 12px; color: #718096; padding: 4px 0; }
  .kv-val { font-size: 12px; color: #e2e8f0; padding: 4px 0; font-family: monospace; word-break: break-all; }
  .kv-val .null { color: #4a5568; font-style: italic; }
  pre { background: #0d1117; border: 1px solid #2d3748; border-radius: 8px; padding: 16px; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: #a8d8a8; }
  .answer-box { background: #0d1117; border: 1px solid #2d3748; border-radius: 8px; padding: 20px; line-height: 1.8; font-size: 14px; color: #e2e8f0; }
  .answer-box strong { color: #90cdf4; }
  .citations { margin-top: 16px; }
  .citation-item { background: #1a2035; border-left: 3px solid #2b6cb0; padding: 8px 12px; margin-bottom: 6px; border-radius: 0 6px 6px 0; font-size: 12px; color: #90cdf4; font-family: monospace; }
  .prompt-msg { margin-bottom: 12px; border-radius: 8px; padding: 12px 16px; }
  .prompt-msg.system { background: #1a2035; border-left: 3px solid #718096; }
  .prompt-msg.user   { background: #1a2b1a; border-left: 3px solid #68d391; }
  .prompt-msg.assistant { background: #1a1f2e; border-left: 3px solid #63b3ed; }
  .prompt-msg .role  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  .prompt-msg.system .role { color: #718096; }
  .prompt-msg.user .role { color: #68d391; }
  .prompt-msg.assistant .role { color: #63b3ed; }
  .prompt-msg .content { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .loading { text-align: center; padding: 40px; color: #4a5568; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #4a5568; border-top-color: #63b3ed; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stat-bar { display: flex; gap: 16px; padding: 12px 24px; background: #131720; border-bottom: 1px solid #2d3748; flex-wrap: wrap; }
  .stat { text-align: center; }
  .stat .num { font-size: 22px; font-weight: 700; color: #63b3ed; }
  .stat .lbl { font-size: 11px; color: #718096; margin-top: 2px; }
  .err { background: #742a2a; border: 1px solid #fc8181; border-radius: 6px; padding: 12px 16px; color: #fc8181; font-size: 13px; margin: 16px; }
  .sas-setup { max-width: 600px; margin: 60px auto; background: #1a1f2e; border: 1px solid #2d3748; border-radius: 12px; padding: 32px; }
  .sas-setup h2 { color: #63b3ed; margin-bottom: 16px; }
  .sas-setup p  { font-size: 13px; color: #a0aec0; margin-bottom: 20px; line-height: 1.6; }
  .sas-setup label { font-size: 12px; color: #718096; display: block; margin-bottom: 6px; }
  .sas-setup input { width: 100%; background: #0d1117; border: 1px solid #4a5568; color: #e2e8f0; padding: 10px 14px; border-radius: 6px; font-size: 13px; outline: none; margin-bottom: 16px; }
  .sas-setup input:focus { border-color: #63b3ed; }
</style>
</head>
<body>

<!-- SAS Setup Screen -->
<div id="setup-screen">
  <div class="sas-setup">
    <h2>🔐 LLM Invocation Archive Viewer</h2>
    <p>请输入 Azure Blob Storage 的 SAS Token（只需 <code>rl</code> 权限），用于读取 LLM 调用的 input / output / metadata 记录。</p>
    <label>Storage Account URL</label>
    <input id="acct-url" value="https://aigoverntrustworthysa.blob.core.windows.net" />
    <label>Container Name</label>
    <input id="container" value="ai-invocation-archive" />
    <label>SAS Token（不含前导 ?）</label>
    <input id="sas-input" type="text" placeholder="se=2026-...&sp=rl&sv=...&sr=c&sig=..." />
    <label>Path Prefix（可选，如 aigoverntrustworthy）</label>
    <input id="prefix-input" value="aigoverntrustworthy" />
    <button id="connect-btn" onclick="connect()">连接</button>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <header>
    <div>
      <div class="logo">🧾 LLM Invocation Archive</div>
      <div class="sub">AI Governance Trustworthy Demo · Blob Evidence Viewer</div>
    </div>
    <div style="margin-left:auto; display:flex; gap:8px; align-items:center">
      <span id="acct-label" style="font-size:12px;color:#4a5568"></span>
      <button class="secondary" onclick="disconnect()">切换账户</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search-box" placeholder="🔍 搜索 service_name / target_type / archive_id ..." oninput="filterRecords()" />
    <select id="filter-type" onchange="filterRecords()">
      <option value="">全部 target_type</option>
    </select>
    <select id="filter-svc" onchange="filterRecords()">
      <option value="">全部 service_name</option>
    </select>
    <select id="filter-time" onchange="filterRecords()">
      <option value="15m" selected>15 分钟以内</option>
      <option value="1h">1 小时以内</option>
      <option value="12h">12 小时以内</option>
      <option value="24h">24 小时以内</option>
      <option value="48h">48 小时以内</option>
      <option value="7d">7 日以内</option>
      <option value="all">所有</option>
    </select>
    <button onclick="loadRecords()">🔄 刷新</button>
    <span id="status-label" style="font-size:12px;color:#718096;margin-left:auto"></span>
  </div>

  <div class="stat-bar" id="stat-bar"></div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>调用记录</span>
        <span id="record-count" style="font-size:11px;color:#4a5568"></span>
      </div>
      <div id="record-list"></div>
    </div>
    <div class="main" id="main-panel">
      <div class="empty">
        <div class="icon">📋</div>
        <div>从左侧选择一条调用记录查看详情</div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
let CFG = { acct: '', container: '', sas: '', prefix: '' };
let allRecords = [];
let filteredRecords = [];
let activeId = null;
let recordData = {}; // cache: archive_id -> {meta, input, output}

// ── Connect ──────────────────────────────────────────────────────────────────
function connect() {
  CFG.acct = document.getElementById('acct-url').value.trim().replace(/\/$/, '');
  CFG.container = document.getElementById('container').value.trim();
  CFG.sas = document.getElementById('sas-input').value.trim().replace(/^\?/, '');
  CFG.prefix = document.getElementById('prefix-input').value.trim();
  if (!CFG.sas) { alert('请填入 SAS Token'); return; }
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('acct-label').textContent = CFG.acct.replace('https://','');
  loadRecords();
}

function disconnect() {
  document.getElementById('setup-screen').style.display = '';
  document.getElementById('app').style.display = 'none';
  allRecords = []; filteredRecords = []; activeId = null; recordData = {};
}

// ── Blob API ─────────────────────────────────────────────────────────────────
async function blobGet(path) {
  const url = `${CFG.acct}/${CFG.container}/${path}?${CFG.sas}`;
  const r = await fetch(url, { headers: { 'x-ms-version': '2020-04-08' } });
  if (!r.ok) throw new Error(`HTTP ${r.status} — ${path}`);
  return r.text();
}

async function blobList(prefix, marker='') {
  let url = `${CFG.acct}/${CFG.container}?restype=container&comp=list&maxresults=500&${CFG.sas}`;
  if (prefix) url += `&prefix=${encodeURIComponent(prefix)}`;
  if (marker) url += `&marker=${encodeURIComponent(marker)}`;
  const r = await fetch(url, { headers: { 'x-ms-version': '2020-04-08' } });
  if (!r.ok) throw new Error(`List failed HTTP ${r.status}`);
  const text = await r.text();
  const names = [...text.matchAll(/<Name>(.*?)<\/Name>/g)].map(m => m[1]);
  const next  = (text.match(/<NextMarker>(.*?)<\/NextMarker>/) || [])[1] || '';
  return { names, next };
}

// ── Load Records ─────────────────────────────────────────────────────────────
async function loadRecords() {
  setStatus('加载中...', true);
  document.getElementById('record-list').innerHTML = '<div class="loading"><span class="spinner"></span>扫描 Blob...</div>';
  try {
    let prefix = CFG.prefix;
    let all = [], marker = '';
    do {
      const { names, next } = await blobList(prefix, marker);
      all = all.concat(names);
      marker = next;
    } while (marker);

    // group by archive_id
    const groups = {};
    for (const n of all) {
      const parts = n.split('/');
      // path: prefix/yyyy/mm/dd/svc/target_type/archive_id/file.json
      if (parts.length >= 8) {
        const archiveId = parts[parts.length - 2];
        const file = parts[parts.length - 1];
        if (!groups[archiveId]) groups[archiveId] = { path: parts.slice(0, -1).join('/'), files: [] };
        groups[archiveId].files.push(file);
      }
    }

    // load metadata for each
    allRecords = [];
    const ids = Object.keys(groups);
    await Promise.all(ids.map(async (aid) => {
      const g = groups[aid];
      if (!g.files.includes('metadata.json')) return;
      try {
        const raw = await blobGet(`${g.path}/metadata.json`);
        const meta = JSON.parse(raw);
        allRecords.push({ archive_id: aid, basePath: g.path, meta, files: g.files });
      } catch(e) { /* skip bad records */ }
    }));

    // sort by time desc
    allRecords.sort((a,b) => {
      const ta = a.meta.occurred_at || '', tb = b.meta.occurred_at || '';
      return tb.localeCompare(ta);
    });

    buildFilters();
    filterRecords();
    renderStats();
    setStatus(`已加载 ${allRecords.length} 条记录`, false);
  } catch(e) {
    document.getElementById('record-list').innerHTML = `<div class="err">❌ ${e.message}</div>`;
    setStatus('加载失败', false);
  }
}

function buildFilters() {
  const types = [...new Set(allRecords.map(r => r.meta.target_type).filter(Boolean))];
  const svcs  = [...new Set(allRecords.map(r => r.meta.service_name).filter(Boolean))];
  const selType = document.getElementById('filter-type');
  const selSvc  = document.getElementById('filter-svc');
  selType.innerHTML = '<option value="">全部 target_type</option>' + types.map(t=>`<option>${t}</option>`).join('');
  selSvc.innerHTML  = '<option value="">全部 service_name</option>' + svcs.map(s=>`<option>${s}</option>`).join('');
}

function filterRecords() {
  const q  = document.getElementById('search-box').value.toLowerCase();
  const ft = document.getElementById('filter-type').value;
  const fs = document.getElementById('filter-svc').value;
  const tf = document.getElementById('filter-time').value;
  const now = Date.now();
  filteredRecords = allRecords.filter(r => {
    if (ft && r.meta.target_type !== ft) return false;
    if (fs && r.meta.service_name !== fs) return false;
    if (!matchesTimeFilter(r.meta.occurred_at, tf, now)) return false;
    if (q) {
      const hay = [r.archive_id, r.meta.service_name, r.meta.target_type, r.meta.target_id, r.meta.model_name].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderList();
  document.getElementById('record-count').textContent = `${filteredRecords.length} / ${allRecords.length}`;
}

function matchesTimeFilter(occurredAt, timeFilter, nowMs) {
  if (!timeFilter || timeFilter === 'all') return true;
  if (!occurredAt) return false;

  const ts = Date.parse(occurredAt);
  if (Number.isNaN(ts) || ts > nowMs) return false;

  const windows = {
    '15m': 15 * 60 * 1000,
    '1h':   1 * 60 * 60 * 1000,
    '12h': 12 * 60 * 60 * 1000,
    '24h': 24 * 60 * 60 * 1000,
    '48h': 48 * 60 * 60 * 1000,
    '7d':   7 * 24 * 60 * 60 * 1000,
  };
  const maxAge = windows[timeFilter];
  if (!maxAge) return true;
  return nowMs - ts <= maxAge;
}

function renderStats() {
  const total = allRecords.length;
  const ok    = allRecords.filter(r => r.meta.status === 'succeeded').length;
  const types = [...new Set(allRecords.map(r => r.meta.target_type).filter(Boolean))];
  const withCit = allRecords.filter(r => (r.meta.citations_count || 0) > 0).length;
  document.getElementById('stat-bar').innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">调用总数</div></div>
    <div class="stat"><div class="num" style="color:#68d391">${ok}</div><div class="lbl">Succeeded</div></div>
    <div class="stat"><div class="num" style="color:#fc8181">${total-ok}</div><div class="lbl">Failed</div></div>
    <div class="stat"><div class="num" style="color:#d6bcfa">${types.length}</div><div class="lbl">Target Types</div></div>
    <div class="stat"><div class="num" style="color:#fbd38d">${withCit}</div><div class="lbl">含 Citations</div></div>
  `;
}

function renderList() {
  const el = document.getElementById('record-list');
  if (!filteredRecords.length) {
    el.innerHTML = '<div class="loading" style="color:#4a5568">无匹配记录</div>';
    return;
  }
  el.innerHTML = filteredRecords.map(r => {
    const m = r.meta;
    const ts = m.occurred_at ? m.occurred_at.replace('T',' ').slice(0,19) : '—';
    const typeClass = (m.target_type||'').includes('rag') ? 'rag' : 'foundry';
    const statusClass = m.status === 'succeeded' ? 'ok' : 'fail';
    return `<div class="record${r.archive_id===activeId?' active':''}" onclick="selectRecord('${r.archive_id}')">
      <div class="rid">${r.archive_id.slice(0,16)}…</div>
      <div class="svc">${m.service_name || '—'}</div>
      <div class="meta">
        <span class="badge ${typeClass}">${m.target_type||'—'}</span>
        <span class="badge ${statusClass}">${m.status||'—'}</span>
        <span>${ts}</span>
      </div>
      <div class="meta">${m.model_name||''} ${m.model_version||''}</div>
    </div>`;
  }).join('');
}

// ── Detail Panel ──────────────────────────────────────────────────────────────
async function selectRecord(aid) {
  activeId = aid;
  renderList();
  const main = document.getElementById('main-panel');
  main.innerHTML = '<div class="loading"><span class="spinner"></span>加载详情...</div>';

  const rec = allRecords.find(r => r.archive_id === aid);
  if (!rec) return;

  try {
    if (!recordData[aid]) {
      const [inputRaw, outputRaw] = await Promise.all([
        rec.files.includes('input.json')  ? blobGet(`${rec.basePath}/input.json`).catch(()=>'{}') : Promise.resolve('{}'),
        rec.files.includes('output.json') ? blobGet(`${rec.basePath}/output.json`).catch(()=>'{}') : Promise.resolve('{}'),
      ]);
      recordData[aid] = {
        input:  tryParse(inputRaw),
        output: tryParse(outputRaw),
        meta:   rec.meta
      };
    }
    renderDetail(aid, recordData[aid]);
  } catch(e) {
    main.innerHTML = `<div class="err">❌ ${e.message}</div>`;
  }
}

function tryParse(s) { try { return JSON.parse(s); } catch { return s; } }

function renderDetail(aid, data) {
  const { meta, input, output } = data;
  const main = document.getElementById('main-panel');
  const ts = meta.occurred_at ? meta.occurred_at.replace('T',' ').replace('+00:00','Z') : '—';

  main.innerHTML = `
    <div class="tabs">
      <div class="tab active" onclick="switchTab('overview','${aid}')">概览</div>
      <div class="tab" onclick="switchTab('prompt','${aid}')">Prompt / Input</div>
      <div class="tab" onclick="switchTab('output','${aid}')">Output</div>
      <div class="tab" onclick="switchTab('raw','${aid}')">Raw JSON</div>
    </div>

    <!-- Overview -->
    <div class="pane active" id="pane-overview">
      <div class="section-title">基础信息</div>
      <div class="kv-grid">
        ${kv('archive_id', aid)}
        ${kv('occurred_at', ts)}
        ${kv('service_name', meta.service_name)}
        ${kv('target_type', meta.target_type)}
        ${kv('source_type', meta.source_type)}
        ${kv('target_id', meta.target_id)}
        ${kv('model_name', meta.model_name)}
        ${kv('model_version', meta.model_version)}
        ${kv('status', meta.status)}
        ${kv('response_id', meta.response_id)}
        ${kv('trace_id', meta.trace_id)}
        ${kv('span_id', meta.span_id)}
        ${kv('test_tool', meta.test_tool)}
        ${kv('test_run_id', meta.test_run_id)}
        ${kv('citations_count', meta.citations_count)}
        ${kv('target_endpoint', meta.target_endpoint)}
      </div>
      ${renderAnswerSection(output)}
    </div>

    <!-- Prompt / Input -->
    <div class="pane" id="pane-prompt">
      ${renderPromptSection(input)}
    </div>

    <!-- Output -->
    <div class="pane" id="pane-output">
      <div class="section-title">完整输出</div>
      ${renderOutputSection(output)}
    </div>

    <!-- Raw JSON -->
    <div class="pane" id="pane-raw">
      <div class="section-title" style="margin-bottom:8px">metadata.json</div>
      <pre>${escHtml(JSON.stringify(meta, null, 2))}</pre>
      <div class="section-title" style="margin:16px 0 8px">input.json</div>
      <pre>${escHtml(JSON.stringify(input, null, 2))}</pre>
      <div class="section-title" style="margin:16px 0 8px">output.json</div>
      <pre>${escHtml(JSON.stringify(output, null, 2))}</pre>
    </div>
  `;
}

function kv(key, val) {
  const display = (val === null || val === undefined || val === '') ? '<span class="null">—</span>' : escHtml(String(val));
  return `<div class="kv-key">${key}</div><div class="kv-val">${display}</div>`;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAnswerSection(output) {
  if (!output || typeof output !== 'object') return '';
  // OpenAI chat completion format
  const choices = output.choices || [];
  if (!choices.length) return '';
  const msg = choices[0].message || {};
  const content = msg.content || '';
  if (!content) return '';
  // look for citations in content (【N:M†source】 pattern)
  const cits = [...content.matchAll(/【[^】]+】/g)].map(m => m[0]);
  const unique = [...new Set(cits)];
  return `
    <div class="section-title" style="margin-top:20px">AI 回答</div>
    <div class="answer-box">${md2html(content)}</div>
    ${unique.length ? `<div class="citations"><div class="section-title" style="margin:12px 0 8px">Citations (${unique.length})</div>${unique.map(c=>`<div class="citation-item">${c}</div>`).join('')}</div>` : ''}
  `;
}

function renderPromptSection(input) {
  if (!input || typeof input !== 'object') return `<div class="section-title">无 Input 数据</div>`;
  const msgs = input.messages || [];
  if (!msgs.length) return `<pre>${escHtml(JSON.stringify(input,null,2))}</pre>`;
  return `<div class="section-title">Messages (${msgs.length})</div>` +
    msgs.map(m => `<div class="prompt-msg ${m.role}">
      <div class="role">${m.role}</div>
      <div class="content">${escHtml(typeof m.content==='string'?m.content:JSON.stringify(m.content,null,2))}</div>
    </div>`).join('');
}

function renderOutputSection(output) {
  if (!output) return '<div style="color:#4a5568">无输出数据</div>';
  if (typeof output === 'string') return `<pre>${escHtml(output)}</pre>`;
  const choices = output.choices || [];
  const parts = [];
  if (output.id) parts.push(`<div class="kv-grid">${kv('response_id', output.id)}${kv('model', output.model)}${kv('usage', output.usage ? JSON.stringify(output.usage) : null)}</div>`);
  for (const c of choices) {
    const msg = c.message || {};
    parts.push(`<div class="prompt-msg assistant">
      <div class="role">assistant (choice ${c.index||0})</div>
      <div class="content">${escHtml(msg.content||'')}</div>
    </div>`);
  }
  return parts.join('') || `<pre>${escHtml(JSON.stringify(output,null,2))}</pre>`;
}

// basic markdown → html for answer display
function md2html(text) {
  return escHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n\n/g, '</p><p style="margin-top:10px">')
    .replace(/\n/g, '<br/>');
}

function switchTab(name, aid) {
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`pane-${name}`).classList.add('active');
  event.target.classList.add('active');
}

function setStatus(msg, loading) {
  const el = document.getElementById('status-label');
  el.innerHTML = loading ? `<span class="spinner" style="display:inline-block;width:12px;height:12px;border-width:1.5px;vertical-align:middle"></span> ${msg}` : msg;
}

// ── Auto-fill SAS if present in URL hash ─────────────────────────────────────
window.addEventListener('load', () => {
  const hash = location.hash.slice(1);
  if (hash.startsWith('sas=')) {
    document.getElementById('sas-input').value = decodeURIComponent(hash.slice(4));
  }
});
</script>
